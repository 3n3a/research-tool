<div class="py-4 flex flex-col gap-2">
  <h1 class="text-4xl pb-4">DNS Lookup</h1>
  <comp-dynamic-form [questions]="questions()" submitButtonText="Search" (payload)="onSubmit($event)" [isLoading]="dnsAnswersLoading()" />
  @if (qDomain()) {
    <div class="flex flex-wrap gap-2">
      <a [routerLink]="'/app/subdomains'" [queryParams]="{ domain: qDomain(), source: 'all' }"
        class="p-button p-button-text">
        <i class="pi pi-sitemap"></i>
        <span>Subdomains of {{ qDomain() }}</span>
      </a>
    </div>
  }
  <comp-dns-table [records]="dnsAnswers() || []" [isLoading]="dnsAnswersLoading()"
    [source]="qDnsSource() || 'cloudflare'" [protocol]="qDnsProto() || 'DoH'"
    (inspectIp)="selectedIp.set($event)" />
  <comp-error-display [errorMessage]="errorMessage()" />
  <comp-ip-inspector [ip]="selectedIp()" (closed)="selectedIp.set(null)" />
</div>
